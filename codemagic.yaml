workflows:
  android-workflow:
    name: Android Build
    max_build_duration: 60
    environment:
      java: 17
    scripts:
      - name: Grant execute permission for gradlew
        script: chmod +x ./gradlew
      - name: Build Android App (APK)
        script: ./gradlew assembleDebug -Xmx512m
    artifacts:
      - app/build/outputs/apk/**/*.apk
